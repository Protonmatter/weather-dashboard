name: Source Snapshot
on:
  push:
    branches: [feature/unified-precipitation-timeline]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/source-snapshot.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: /tmp/source-snapshot.tgz
          retention-days: 1
