name: Source Snapshot
on:
  push:
    branches: [feature/unified-precipitation-timeline]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Archive source and dependencies
        run: tar --exclude=.git -czf /tmp/source-snapshot.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: /tmp/source-snapshot.tgz
          retention-days: 1
